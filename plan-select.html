<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose your plan</title>
<style>
:root {
  --bg: #f7f8fa;
  --card-bg: #ffffff;
  --border: #e3e5e9;
  --border-selected: #0074d4;
  --text-primary: #14181f;
  --text-secondary: #6b7280;
  --accent: #0074d4;
  --badge-bg: #0074d4;
  --badge-text: #ffffff;
  --button-bg: #14181f;
  --button-text: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d12;
    --card-bg: #171a21;
    --border: #2a2e38;
    --text-primary: #f5f6f8;
    --text-secondary: #9aa0ac;
    --button-bg: #ffffff;
    --button-text: #0b0d12;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 64px 24px;
}
.logo { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; margin-bottom: 32px; }
.logo img { width: 100%; height: 100%; object-fit: cover; }
h1 { font-size: 32px; font-weight: 700; margin: 0 0 8px; text-align: center; letter-spacing: -0.02em; }
.subtitle { font-size: 16px; color: var(--text-secondary); margin: 0 0 48px; text-align: center; }
.cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
.card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
  padding: 32px 28px; width: 300px; display: flex; flex-direction: column; gap: 16px;
  position: relative; transition: border-color 0.15s, transform 0.15s;
}
.card.highlight { border-color: var(--border-selected); border-width: 2px; }
.badge {
  position: absolute; top: -12px; left: 28px; background: var(--badge-bg); color: var(--badge-text);
  font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px; letter-spacing: 0.02em;
}
.card-title { font-size: 15px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
.price-row { display: flex; align-items: baseline; gap: 6px; }
.price { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
.period { font-size: 15px; color: var(--text-secondary); }
.strike { font-size: 14px; color: var(--text-secondary); text-decoration: line-through; }
.card-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.5; min-height: 42px; }
.select-btn {
  margin-top: 8px; width: 100%; padding: 14px; border-radius: 10px; border: none;
  font-size: 15px; font-weight: 600; cursor: pointer; background: var(--button-bg); color: var(--button-text);
}
.card:not(.highlight) .select-btn { background: transparent; color: var(--text-primary); border: 1px solid var(--border); }
.error { color: var(--text-secondary); font-size: 15px; text-align: center; }
</style>
</head>
<body>

<h1>Choose your plan</h1>
<p class="subtitle">Pick the option that works best for you.</p>
<div class="cards" id="cards"></div>

<script>
const params = new URLSearchParams(window.location.search);
const annualUrl = params.get("yurl");
const annualAmount = params.get("yamt");
const originalUrl = params.get("nurl");
const originalAmount = params.get("namt");
const originalPeriod = params.get("nperiod") || "/month";
const strikeAmount = params.get("ystrike");
const discountPct = params.get("disc");

const cardsEl = document.getElementById("cards");

if (!annualUrl || !originalUrl || !annualAmount || !originalAmount) {
  cardsEl.innerHTML = `<p class="error">This link is missing information. Please contact us for a new payment link.</p>`;
} else {
  const plans = [
    {
      title: "Annual", price: annualAmount, period: "/year", strike: strikeAmount,
      desc: discountPct ? `Save ${discountPct}% compared to your current plan.` : "Billed once a year.",
      badge: discountPct ? `Save ${discountPct}%` : null,
      url: annualUrl, highlight: true, cta: "Choose annual",
    },
    {
      title: "Current plan", price: originalAmount, period: originalPeriod, strike: null,
      desc: "Keep paying as originally agreed, no changes.",
      badge: null, url: originalUrl, highlight: false, cta: "Keep this plan",
    },
  ];

  cardsEl.innerHTML = plans.map(p => `
    <div class="card ${p.highlight ? "highlight" : ""}">
      ${p.badge ? `<div class="badge">${p.badge}</div>` : ""}
      <div class="card-title">${p.title}</div>
      <div>
        <div class="price-row"><span class="price">\u20ac${p.price}</span><span class="period">${p.period}</span></div>
        ${p.strike ? `<div class="strike">\u20ac${p.strike}${p.period}</div>` : ""}
      </div>
      <div class="card-desc">${p.desc}</div>
      <button class="select-btn" onclick="window.location.href='${p.url}'">${p.cta}</button>
    </div>
  `).join("");
}
</script>
