<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your REVER plan</title>
<style>
  :root {
    --bg: #fbfbfd;
    --surface: #ffffff;
    --border: #d2d2d7;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --accent: #0071e3;
    --button-bg: #1d1d1f;
    --button-text: #ffffff;
    --track-bg: #e8e8ed;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --surface: #1c1c1e;
      --border: #38383a;
      --text: #f5f5f7;
      --text-secondary: #98989d;
      --accent: #2997ff;
      --button-bg: #f5f5f7;
      --button-text: #1d1d1f;
      --track-bg: #2c2c2e;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 88px 24px 64px;
  }
  main { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
  #content { width: 100%; }

  .logo { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; margin-bottom: 32px; }
  .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  h1 {
    font-size: 30px; font-weight: 600; letter-spacing: -0.015em;
    margin: 0 0 8px; text-align: center; line-height: 1.15;
  }
  .subtitle {
    font-size: 16px; line-height: 1.5; color: var(--text-secondary);
    margin: 0 0 40px; text-align: center; max-width: 320px;
  }

  /* Segmented control */
  .switcher {
    position: relative; display: flex; width: 100%;
    background: var(--track-bg); border-radius: 12px; padding: 3px;
    margin-bottom: 40px;
  }
  .switcher-thumb {
    position: absolute; top: 3px; bottom: 3px; left: 3px;
    width: calc(50% - 3px); background: var(--surface);
    border-radius: 9px; box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  }
  [data-selected="current"] .switcher-thumb { transform: translateX(100%); }
  .switcher button {
    position: relative; flex: 1; z-index: 1; border: none; background: transparent;
    font-size: 14px; font-weight: 500; color: var(--text-secondary);
    padding: 9px 4px; border-radius: 9px; cursor: pointer;
    font-family: inherit; transition: color 0.25s;
  }
  .switcher button[aria-selected="true"] { color: var(--text); }
  .switcher button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Price block */
  .price-block { text-align: center; min-height: 148px; }
  .price-row {
    display: flex; align-items: baseline; justify-content: center; gap: 8px;
  }
  .price {
    font-size: 56px; font-weight: 300; letter-spacing: -0.02em; line-height: 1;
  }
  .price-period { font-size: 17px; color: var(--text-secondary); }
  .price-note {
    font-size: 14px; color: var(--text-secondary); margin-top: 10px; line-height: 1.5;
    text-align: center;
  }
  .price-note strong { color: var(--text); font-weight: 500; }

  hr {
    width: 100%; border: none; border-top: 1px solid var(--border);
    margin: 28px 0;
  }

  .plan-desc {
    font-size: 14px; color: var(--text-secondary); line-height: 1.6;
    text-align: center; margin: 0 0 28px;
  }

  .continue-btn {
    width: 100%; padding: 14px; border: none; border-radius: 980px;
    background: var(--button-bg); color: var(--button-text);
    font-size: 16px; font-weight: 500; font-family: inherit; cursor: pointer;
    transition: opacity 0.2s;
  }
  .continue-btn:hover { opacity: 0.85; }
  .continue-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .footnote {
    font-size: 12px; color: var(--text-secondary); margin-top: 22px; text-align: center;
  }

  .error { font-size: 15px; color: var(--text-secondary); text-align: center; margin-top: 40px; }

  .fade { transition: opacity 0.22s ease; }
  .fade.out { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .switcher-thumb, .continue-btn, .fade { transition: none !important; }
  }

  @media (max-width: 420px) {
    body { padding-top: 56px; }
    h1 { font-size: 26px; }
    .price { font-size: 46px; }
  }
</style>
</head>
<body>

  <div id="content">
    <h1>Choose your plan</h1>
    <p class="subtitle" id="subtitle">Pick the option that works best for you.</p>

    <div class="switcher" id="switcher" data-selected="annual">
      <div class="switcher-thumb"></div>
      <button id="btn-annual" role="tab" aria-selected="true">Pay annually</button>
      <button id="btn-current" role="tab" aria-selected="false">Current plan</button>
    </div>

    <div class="price-block fade" id="priceBlock">
      <div class="price-row">
        <span class="price" id="price">—</span>
        <span class="price-period" id="pricePeriod"></span>
      </div>
      <p class="price-note" id="priceNote"></p>
    </div>

    <hr>

    <p class="plan-desc" id="planDesc"></p>

    <button class="continue-btn" id="continueBtn"></button>
    <p class="footnote">Secure checkout by Stripe.</p>
  </div>

  <p class="error" id="errorMsg" style="display:none;">This link is missing information. Please contact us for a new payment link.</p>
</main>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const data = {
    annualUrl: params.get("yurl"),
    annualAmount: params.get("yamt"),
    strikeAmount: params.get("ystrike"),
    discountPct: params.get("disc"),
    originalUrl: params.get("nurl"),
    originalAmount: params.get("namt"),
    originalPeriod: params.get("nperiod") || "/month",
  };

  if (!data.annualUrl || !data.originalUrl || !data.annualAmount || !data.originalAmount) {
    document.getElementById("content").style.display = "none";
    document.getElementById("errorMsg").style.display = "block";
    return;
  }

  // originalPeriod is always "/month" or "/every N months" (from the sync script)
  const clean = data.originalPeriod.replace(/^\//, ""); // "month" or "every 3 months"
  const cadence = clean === "month" ? "monthly" : clean; // adverbial: "monthly" / "every 3 months"
  const periodLabel = clean === "month" ? "per month" : clean; // shown next to the price

  const plans = {
    annual: {
      price: data.annualAmount,
      period: "per year",
      note: data.discountPct
        ? `Billed as <strong>€${data.annualAmount}</strong> once a year — that's ${data.discountPct}% less than paying ${cadence}.`
        : "Billed once a year.",
      desc: `Same REVER plan and features, billed annually instead of ${cadence}.`,
      cta: "Continue with the annual plan",
      url: data.annualUrl,
    },
    current: {
      price: data.originalAmount,
      period: periodLabel,
      note: "No changes — keep paying as originally agreed.",
      desc: "Your REVER plan continues exactly as it is today.",
      cta: "Continue with your current plan",
      url: data.originalUrl,
    },
  };

  const switcherEl = document.getElementById("switcher");
  const btnAnnual = document.getElementById("btn-annual");
  const btnCurrent = document.getElementById("btn-current");
  const priceBlock = document.getElementById("priceBlock");
  const priceEl = document.getElementById("price");
  const periodEl = document.getElementById("pricePeriod");
  const noteEl = document.getElementById("priceNote");
  const descEl = document.getElementById("planDesc");
  const continueBtn = document.getElementById("continueBtn");

  let current = "annual";

  function render(key) {
    const p = plans[key];
    priceEl.textContent = "€" + p.price;
    periodEl.textContent = p.period;
    noteEl.innerHTML = p.note;
    descEl.textContent = p.desc;
    continueBtn.textContent = p.cta;
    continueBtn.onclick = function () { window.location.href = p.url; };
  }

  function select(key) {
    if (key === current) return;
    current = key;
    switcherEl.dataset.selected = key;
    btnAnnual.setAttribute("aria-selected", key === "annual");
    btnCurrent.setAttribute("aria-selected", key === "current");

    priceBlock.classList.add("out");
    setTimeout(function () {
      render(key);
      priceBlock.classList.remove("out");
    }, 150);
  }

  btnAnnual.addEventListener("click", function () { select("annual"); });
  btnCurrent.addEventListener("click", function () { select("current"); });

  render("annual");
})();
</script>
</body>
</html>
